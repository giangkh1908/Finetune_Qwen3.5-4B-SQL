# Model Configuration
model:
  name: "Qwen/Qwen3.5-4B"
  load_in_4bit: true
  max_seq_length: 2048
  dtype: null # Tự động chọn bf16 hoặc fp16

# LoRA / QLoRA Configuration
lora:
  r: 16
  lora_alpha: 32
  lora_dropout: 0.0
  target_modules:
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "o_proj"
    - "gate_proj"
    - "up_proj"
    - "down_proj"
  bias: "none"
  use_gradient_checkpointing: "unsloth"

# Training Hyperparameters
training:
  output_dir: "./outputs/qwen3_5_4b_text2sql"
  per_device_train_batch_size: 2
  gradient_accumulation_steps: 8
  learning_rate: 1.5e-4
  lr_scheduler_type: "cosine"
  warmup_ratio: 0.05
  weight_decay: 0.01
  num_train_epochs: 1
  logging_steps: 10
  save_strategy: "steps"
  save_steps: 200
  save_total_limit: 2
  seed: 3407

# Data Paths
data:
  train_file: "data/processed/train.jsonl"
  val_file: "data/processed/val.jsonl"
  benchmark_file: "data/benchmark/test_benchmark.jsonl"
  sqlite_dir: "data/benchmark/sqlite_dbs"
